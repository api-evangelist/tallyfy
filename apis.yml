name: Tallyfy
description: >-
  Tallyfy is workflow and business process management software that lets teams
  document, launch, track, and automate repeatable processes, SOPs, approvals, and
  forms without code. Its REST API models templates as "checklists" and processes as
  "runs" and exposes tasks, form fields (captures), kick-off forms, guests, members,
  groups, tags, and folders. Developers and AI agents can embed Tallyfy through the
  REST API, outbound JSON webhooks, a public hosted MCP server (mcp.tallyfy.com), an
  official Go CLI, and an n8n community node.
